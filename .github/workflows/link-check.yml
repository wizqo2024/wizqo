name: Link Check (Sitemap)

on:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy
        run: sleep 90
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run sitemap link check (with retry)
        env:
          SITE_ORIGIN: https://wizqo.com
        run: |
          for i in 1 2 3; do
            node scripts/check-sitemap-links.js && exit 0 || echo "Retry $i..." && sleep 20
          done
          echo "Link check failed after retries" && exit 1
